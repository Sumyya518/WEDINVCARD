<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message for Adnan</title>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --dim: #94a3b8;
            --heart: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: var(--text);
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Stars Background */
        .stars { position: fixed; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* Unlock Screen */
        .lock { text-align: center; cursor: pointer; z-index: 5; transition: 0.5s; }
        .heart-icon { font-size: 70px; animation: beat 1.5s infinite; filter: drop-shadow(0 0 20px var(--heart)); }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        /* Terminal UI */
        .terminal {
            display: none;
            flex-direction: column;
            width: 92%;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .topbar {
            padding: 12px;
            background: rgba(0,0,0,0.5);
            display: flex;
            gap: 8px;
            border-radius: 12px 12px 0 0;
            align-items: center;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }

        .content {
            padding: 25px;
            min-height: 400px;
            max-height: 450px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 14px;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* Cursor */
        .cursor { display: inline-block; width: 8px; height: 1.2em; background: var(--accent); vertical-align: middle; animation: blink 1s infinite; margin-left: 4px;}
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        /* Form */
        form { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        input, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }

        /* Footer Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            border-radius: 0 0 12px 12px;
        }
        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover:not(:disabled) { background: var(--accent); color: var(--bg); box-shadow: 0 0 10px var(--accent); }
        button:disabled { border-color: #334155; color: #334155; cursor: not-allowed; }
        .page-info { font-size: 11px; color: var(--dim); align-self: center; }

        .submit-btn {
            background: var(--accent);
            color: var(--bg);
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="stars" id="starfield"></div>

<div class="lock" id="gate" onclick="initSession()">
    <div class="heart-icon">❤️</div>
    <p style="letter-spacing:4px; color:var(--accent); margin-top:20px; font-size: 11px;">RUN: SECURE_COMMUNICATION.sh</p>
</div>

<div class="terminal" id="mainUI">
    <div class="topbar">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <span style="font-size:9px; margin-left:auto; opacity: 0.4;">ID: 1803-ADNAN-SUMYYA</span>
    </div>

    <div class="content" id="scrollBox">
        <div class="page active" id="p1">
            <span id="txt1"></span><span class="cursor" id="c1"></span>
        </div>

        <div class="page" id="p2">
            <span id="txt2"></span><span class="cursor" id="c2"></span>
        </div>

        <div class="page" id="p3">
            <span id="txt3"></span><span class="cursor" id="c3"></span>
        </div>

        <div class="page" id="p4">
            <p style="color:var(--accent); margin-bottom: 10px;">// REPLY_TRANSMISSION_OPEN</p>
            <p>Adnan, type your message to your wife Sumyya:</p>
            <form action="https://formspree.io/f/xwvnrddb" method="POST">
                <input type="email" name="email" value="adnan@example.com" required>
                <textarea name="message" rows="5" placeholder="Enter your response..." required></textarea>
                <button type="submit" class="submit-btn">SEND TO SUMYYA DIRECTLY</button>
            </form>
        </div>
    </div>

    <div class="controls" id="navBar" style="display:none;">
        <button id="prev" onclick="navigate(-1)" disabled>BACK</button>
        <span class="page-info" id="pCount">PAGE 1 / 4</span>
        <button id="next" onclick="navigate(1)">NEXT</button>
    </div>
</div>

<script>
    // Create Stars
    const stars = document.getElementById("starfield");
    for(let i=0; i<70; i++) {
        let s = document.createElement("div");
        s.className = "star";
        s.style.top = Math.random()*100+"%";
        s.style.left = Math.random()*100+"%";
        s.style.animationDelay = Math.random()*3+"s";
        stars.appendChild(s);
    }

    let current = 1;
    let typing = false;

    const data = {
        1: `To my most beloved person,

I see how much you carry. I see the responsibilities on your shoulders. You are not alone in this. Providing is your duty by Allah's command, but it is not a load you carry alone.

A truly successful marriage leads a man and a woman to Jannah together. It's when two people choose deen over ego. I will always be there in your stress, your growth, and your victories.`,

        2: `You once said only arranged marriages are successful. But success is not how it starts; it is how it is lived.

Like Khadijah (RA) stood beside Prophet Muhammad ﷺ — not just as a wife, but as comfort and strength. When he came home worried, she didn't increase his fear; she reminded him of his goodness.

I will support you emotionally, spiritually, and with my duas every single day.`,

        3: `My husband is always great and brilliant, with a beautiful smile on his handsome face. He is No.1. Both deen and dunya fikr wala.

My beloved husband Adnan Ahmad... I don't want anything from you — nothing, just you. Wallahi, I love you beyond any imagination.

I am with you. Always.
— From Sumyya`
    };

    function initSession(){
        document.getElementById("gate").style.display = "none";
        document.getElementById("mainUI").style.display = "flex";
        document.getElementById("navBar").style.display = "flex";
        runTyping(1);
    }

    function runTyping(p) {
        if (!data[p]) return;
        typing = true;
        let target = document.getElementById("txt" + p);
        let csr = document.getElementById("c" + p);
        let i = 0;
        let str = data[p];
        
        target.innerHTML = "";
        csr.style.display = "inline-block";

        function t() {
            if(i < str.length) {
                target.innerHTML += str.charAt(i);
                i++;
                document.getElementById("scrollBox").scrollTop = document.getElementById("scrollBox").scrollHeight;
                setTimeout(t, 25);
            } else {
                typing = false;
                csr.style.display = "none";
            }
        }
        t();
    }

    function navigate(d) {
        if (typing) return;
        document.getElementById("p" + current).classList.remove("active");
        current += d;
        document.getElementById("p" + current).classList.add("active");

        document.getElementById("prev").disabled = (current === 1);
        document.getElementById("next").style.visibility = (current === 4) ? "hidden" : "visible";
        document.getElementById("pCount").innerText = `PAGE ${current} / 4`;

        if (data[current] && document.getElementById("txt" + current).innerHTML === "") {
            runTyping(current);
        }
    }
</script>

</body>
</html>
